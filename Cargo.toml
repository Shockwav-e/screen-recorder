[package]
name = "shockwave-screen-recorder"
version = "0.1.0"
edition = "2021"
description = "Shockwave Screen Recorder — lightweight OBS-like WebM 1080p60 game recorder for Windows"
license = "MIT"

[[bin]]
name = "shockwave-rec"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
windows-capture = "2"
ffmpeg-sidecar = { version = "2", features = ["download_ffmpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
ctrlc = "2"
cpal = "0.16"
eframe = "0.32"
rfd = "0.17"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "unwind"
