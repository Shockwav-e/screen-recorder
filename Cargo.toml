[package]
name = "crabby"
version = "1.0.0"
edition = "2021"
description = "Crabby — lightweight OBS-like 1080p60 game recorder for Windows"
license = "MIT"
authors = ["Crabby"]
homepage = "https://github.com/Shockwav-e/screen-recorder"
repository = "https://github.com/Shockwav-e/screen-recorder"
keywords = ["screen-recorder", "game-capture", "ffmpeg", "windows"]
rust-version = "1.75"

[[bin]]
name = "crabby"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
windows-capture = "2"
ffmpeg-sidecar = { version = "2", features = ["download_ffmpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
ctrlc = "2"
cpal = "0.16"
eframe = "0.32"
rfd = "0.17"
ureq = { version = "3", features = ["json"] }
semver = "1"
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "unwind"
